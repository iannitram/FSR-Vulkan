# Our CI for universal/ (the uscale C API) on Linux, Windows and macOS (SPEC.md M10).
# Upstream's own workflow is ci.yml; this file is ours. Public repo: GitHub-hosted runners (R29).
name: fork-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  uscale:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        ffx: ['OFF']
        include:
          - os: ubuntu-24.04
            ffx: 'ON'
          - os: macos-latest
            ffx: 'ON'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan headers and loader (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends cmake gcc g++ libvulkan-dev
      - name: Install Mesa lavapipe (Linux)
        if: runner.os == 'Linux'
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get install -y --no-install-recommends mesa-vulkan-drivers
          lvp_icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$lvp_icd"
          echo "VK_DRIVER_FILES=$lvp_icd" >> "$GITHUB_ENV"
          echo "USCALE_REQUIRE_VK_DEVICE=1" >> "$GITHUB_ENV"
      - name: Install Vulkan headers, loader and MoltenVK (macOS)
        if: runner.os == 'macOS'
        run: brew install vulkan-headers vulkan-loader molten-vk
      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="-DCMAKE_PREFIX_PATH=$(brew --prefix)"; fi
          cmake -S universal -B build-uscale -DCMAKE_BUILD_TYPE=Release -DUSCALE_WITH_FFX=${{ matrix.ffx }} $EXTRA
      - name: Build (warnings are errors)
        shell: bash
        run: cmake --build build-uscale --config Release --parallel
      - name: Test
        shell: bash
        run: ctest --test-dir build-uscale -C Release --output-on-failure
      - name: Recovered pipelines are not built (ruling 2026-11-01)
        shell: bash
        run: |
          # EXCLUDE_FROM_ALL still generates target directories; check files.
          hits=$(find build-uscale -type f \( -iname '*xess_recovered*' -o -iname '*dlss_contract*' -o -iname '*d4r_*' \) -print -quit)
          if [ -n "$hits" ]; then echo "Forbidden targets were built:"; echo "$hits"; exit 1; fi
          echo "none built"
